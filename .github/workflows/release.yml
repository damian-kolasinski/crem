name: Release

# A vX.Y.Z tag publishes a release: crem for every target, signed with
# packslip so mise can verify it before installing. A pull request that
# changes how releases are built runs the builds without signing or
# publishing.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Build
        # crem is pure Go, so one runner cross-compiles every target. It sits
        # at the archive root, where packslip and mise look for it.
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dev' }}
        run: |
          mkdir dist
          for target in aarch64-apple-darwin:darwin:arm64 x86_64-apple-darwin:darwin:amd64 \
                        x86_64-unknown-linux-gnu:linux:amd64 aarch64-unknown-linux-gnu:linux:arm64; do
            IFS=: read -r triple goos goarch <<< "$target"
            mkdir -p "build/$triple"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" -o "build/$triple/crem" ./cmd/crem
            tar czf "dist/crem-$triple.tar.gz" -C "build/$triple" crem
          done
      - name: The binary runs
        run: |
          tar xzf dist/crem-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/crem" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crem
          path: dist/crem-*.tar.gz
          if-no-files-found: error

  sign:
    # Signs the archives with this workflow's identity. The job can't write to
    # the repository, so a compromised step here can't publish.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle: ${{ steps.packslip.outputs.bundle }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crem
          path: dist
      - id: packslip
        uses: jdx/packslip@7b32cd29a9240927882ee18b3db1dcfd8e0328b4 # v1.7.0
        with:
          artifacts: dist/crem-*.tar.gz
          bin: crem
          # Attestations stay on for every release: an installer may refuse a
          # release that drops provenance earlier ones had.
          upload: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  release:
    # One `gh release create` with every asset, so the release never shows
    # without its signature.
    if: github.ref_type == 'tag'
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
